<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elements Help</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff; --surface:#f4f6f9; --fg:#1c2027; --body:#3f444d; --muted:#626a77; --line:#dfe3ea;
  --navy:#1D2F5D; --navy-hover:#0f1d40; --green:#33A542; --gold:#E6A730; --gold-hover:#d4951f; --gold-ink:#1d1403;
  --chip:#eef1f6; --focus:#E6A730;
  --f:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--body);font:14px/1.45 var(--f)}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{padding:14px 16px 18px;max-width:560px;margin:0 auto}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 14px;border-radius:8px;
  background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:14.5px;text-decoration:none;border:0}
.cta:hover{background:var(--gold-hover)}
.cta svg{width:16px;height:16px}
.search{position:relative;margin:14px 0 4px}
.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--fg);background:var(--bg)}
.search input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(29,47,93,.12)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:700}
.list{list-style:none;margin:0;padding:0}
.res a{display:block;padding:8px 10px;border-radius:6px;text-decoration:none;border-bottom:1px solid var(--line)}
.res a:hover{background:var(--surface)}
.res .t{color:var(--fg);font-weight:600}
.res .m{font-size:12px;color:var(--muted)}
.res .d{font-size:12.5px;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);padding:8px 2px}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;list-style:none;padding:10px 26px 10px 2px;color:var(--fg);font-weight:600;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"";position:absolute;right:6px;top:15px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg);top:18px}
.ans{padding:0 2px 12px}
.ans p{margin:0 0 6px}
.more{font-weight:600;font-size:13px;text-decoration:none}
.more:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{background:var(--chip);color:var(--navy);text-decoration:none;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px}
.chips a:hover{background:#e2e7f0}
.foot{margin-top:16px;font-size:11.5px;color:var(--muted);text-align:center}
[hidden]{display:none!important}
</style>
</head>

</main>

(function(){
  var D = JSON.parse(document.getElementById('faq-data').textContent);

  function link(slug){return BASE + '#' + encodeURIComponent(slug);}
  function a(href, inner, cls){return '<a'+(cls?' class="'+cls+'"':'')+' href="'+href+'" target="_blank" rel="noopener">'+inner+'</a>';}

  document.getElementById('faq').innerHTML = D.faq.map(function(f){
    return '<details><summary>'+esc(f.q)+'</summary><div class="ans"><p>'+esc(f.a)+'</p>'+
      a(link(f.s), 'Read the full guide &rarr;', 'more')+'</div></details>';
  }).join('');

  document.getElementById('mods').innerHTML = D.mods.map(function(m){
    return a(BASE + '#module-' + encodeURIComponent(m.id), esc(m.t));
  }).join('');

  var idx = D.pages.map(function(p){
    return {p:p, t:p.t.toLowerCase(), all:(p.t+' '+p.d+' '+p.k+' '+p.m).toLowerCase()};
  });
  var q = document.getElementById('q'), res = document.getElementById('results'),
      list = document.getElementById('resList'), home = document.getElementById('home');

  function search(){
    var v = q.value.trim().toLowerCase();
    if(v.length < 2){res.hidden = true; home.hidden = false; return;}
    var words = v.split(/\s+/);
    var hits = idx.map(function(r){
      var score = 0;
      for(var i=0;i<words.length;i++){
        var w = words[i];
        if(r.all.indexOf(w) < 0) return null;
        if(r.t.indexOf(w) === 0) score += 6; else if(r.t.indexOf(w) >= 0) score += 4; else score += 1;
      }
      return {r:r, score:score};
    }).filter(Boolean).sort(function(x,y){return y.score - x.score;}).slice(0,12);
    home.hidden = true; res.hidden = false;
    list.innerHTML = hits.length ? hits.map(function(h){
      var p = h.r.p;
      return '<li>'+a(link(p.s), '<div class="t">'+esc(p.t)+'</div><div class="m">'+esc(p.m)+'</div><div class="d">'+esc(p.d)+'</div>')+'</li>';
    }).join('') : '<li class="empty">No matches. Try another word, or open the full Help Center.</li>';
  }
  q.addEventListener('input', search);
})();
</script>
</body>
</html>
